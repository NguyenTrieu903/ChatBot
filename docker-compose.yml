version: '3.8'

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-tam-quoc-te
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_DISABLE_DEPRECATED_PLUGIN_CHECK=1
    volumes:
      # Mount data directory để có thể cập nhật dữ liệu
      - ./data:/app/data:ro
      # Mount conversation memory để lưu lịch sử chat
      - ./conversation_memory:/app/conversation_memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

